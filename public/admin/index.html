--text:#ffffff;--muted:#888888;--border:#222222;

--pri:#FF6B00;--pri2:#FF8C33;--pri-dark:#CC5500;
--bg:#0a0a1a;--bg2:#12122a;--card:rgba(30,30,54,.45);--card2:rgba(37,37,69,.45);
--text:#e0e0f0;--muted:#8888aa;--border:rgba(255,255,255,.1);
--green:#2ecc71;--red:#e74c3c;--blue:#3498db;--purple:#9b59b6;--teal:#1abc9c;--amber:#f0a500;
--shadow:0 8px 32px rgba(0,0,0,.3);--radius:20px;--glass:1;
}

/* ============ RESET & BASE ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
  transition:background .4s,color .4s;
}
a{color:var(--pri);text-decoration:none}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}

/* ============ SCROLLBAR ============ */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

/* ============ SPLASH SCREEN ============ */
#splash{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);transition:opacity .6s,visibility .6s;
}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo-photo-box{
  width:96px;height:96px;border-radius:24px;padding:3px;
  background:linear-gradient(135deg,rgba(255,255,255,.3),var(--pri),rgba(0,0,0,.3));
  box-shadow:0 12px 35px rgba(0,0,0,.5),0 0 30px rgba(255,107,0,.4);
  margin-bottom:18px;display:flex;align-items:center;justify-content:center;
  animation:splashPhotoPop .8s cubic-bezier(.16,1,.3,1) forwards;
}
.splash-logo-photo{
  width:100%;height:100%;border-radius:21px;object-fit:cover;display:block;
}
@keyframes splashPhotoPop{
  0%{opacity:0;transform:scale(0.5) translateY(20px)}
  70%{transform:scale(1.06) translateY(-4px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
.splash-logo{
  font-size:clamp(2rem,8vw,4.5rem);font-weight:900;letter-spacing:.05em;
  display:flex;gap:4px;margin-bottom:24px;
}
.splash-logo span{
  display:inline-block;opacity:0;transform:translateY(30px) rotateX(90deg);
  animation:splashLetter .5s forwards;
  background:linear-gradient(135deg,var(--pri),var(--pri2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  text-shadow:none;filter:drop-shadow(0 0 20px var(--pri));
}
@keyframes splashLetter{
  to{opacity:1;transform:translateY(0) rotateX(0deg)}
}
.splash-subtitle{
  font-size:1.1rem;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;
  margin-bottom:30px;opacity:0;animation:fadeInUp .6s .8s forwards;
}
.splash-progress{
  width:80px;height:80px;position:relative;opacity:0;animation:fadeInUp .6s 1s forwards;
}
.splash-progress svg{transform:rotate(-90deg)}
.splash-progress circle{fill:none;stroke-width:4}
.splash-progress .bg-ring{stroke:var(--border)}
.splash-progress .fg-ring{stroke:var(--pri);stroke-linecap:round;stroke-dasharray:226;stroke-dashoffset:226;transition:stroke-dashoffset 2s linear}
.splash-progress.pct-100 .fg-ring{stroke-dashoffset:0}
.splash-pct{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.85rem;font-weight:700;color:var(--pri);
}
@keyframes fadeInUp{to{opacity:1;transform:translateY(0)}}

/* ============ LOGIN ============ */
#login{
  display:none;min-height:100vh;
  align-items:center;justify-content:center;padding:20px;
  background:var(--bg);
}
#login.active{display:flex}
.login-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:40px;width:100%;max-width:400px;
  box-shadow:var(--shadow);
}
.login-card.glass{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.login-logo{width:80px;height:80px;margin:0 auto 20px;display:block;border-radius:16px}
.login-title{text-align:center;font-size:1.5rem;font-weight:700;margin-bottom:8px}
.login-sub{text-align:center;color:var(--muted);margin-bottom:28px;font-size:.9rem}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px;font-weight:500}
.form-input{
  width:100%;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:.95rem;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.form-input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(255,107,0,.15)}
.form-input::placeholder{color:var(--muted)}
.btn{
  padding:12px 24px;border:none;border-radius:10px;font-size:.95rem;font-weight:600;
  transition:all .2s;display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:hover{background:var(--pri-dark);transform:translateY(-1px)}
.btn-sec{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-sec:hover{background:var(--border)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{filter:brightness(.85)}
.btn-sm{padding:6px 14px;font-size:.82rem;border-radius:8px}
.btn-block{width:100%}
.login-error{
  background:rgba(231,76,60,.15);color:var(--red);padding:10px 14px;
  border-radius:8px;font-size:.85rem;margin-bottom:16px;display:none;
}
.login-error.show{display:block}

/* ============ APP SHELL ============ */
#app{display:none;min-height:100vh;flex-direction:column}
#app.active{display:flex}

/* Top bar */
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:0 20px;height:60px;display:flex;align-items:center;gap:16px;
  position:sticky;top:0;z-index:100;
  box-shadow:var(--shadow);
}
.topbar-brand{font-weight:800;font-size:1.2rem;color:var(--pri);white-space:nowrap}
.topbar-brand span{color:var(--text)}
.topbar-spacer{flex:1}
.topbar-actions{display:flex;align-items:center;gap:10px}
.topbar-btn{
  background:var(--card2);border:1px solid var(--border);color:var(--text);
  padding:8px 12px;border-radius:8px;font-size:.85rem;
  transition:all .2s;display:flex;align-items:center;gap:6px;
}
.topbar-btn:hover{background:var(--border);color:var(--pri)}
.topbar-avatar{
  width:34px;height:34px;border-radius:50%;background:var(--pri);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.85rem;
}

/* Sidebar */
.sidebar{
  width:240px;min-height:calc(100vh - 60px);background:var(--card);
  border-right:1px solid var(--border);flex-shrink:0;
  transition:transform .3s,visibility .3s;
  overflow-y:auto;
}
.sidebar-nav{padding:12px 0}
.sidebar-item{
  display:flex;align-items:center;gap:12px;padding:12px 20px;
  color:var(--muted);font-size:.9rem;font-weight:500;
  transition:all .2s;cursor:pointer;border-left:3px solid transparent;
}
.sidebar-item:hover{color:var(--text);background:var(--card2)}
.sidebar-item.active{color:var(--pri);background:rgba(255,107,0,.08);border-left-color:var(--pri)}
.sidebar-item svg{width:20px;height:20px;flex-shrink:0}

/* Layout */
.app-body{display:flex;flex:1}
.main-content{flex:1;padding:24px;overflow-y:auto;min-width:0}

/* ============ CARDS ============ */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;
}
.card:hover{transform:translateY(-2px)}
.card.glass{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.card-title{font-size:.85rem;color:var(--muted);margin-bottom:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* Stat cards */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow);
  transition:transform .2s;
}
.stat-card:hover{transform:translateY(-3px)}
.stat-card.glass{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.stat-icon{
  width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;margin-bottom:12px;
}
.stat-icon.orange{background:rgba(255,107,0,.15);color:var(--pri)}
.stat-icon.green{background:rgba(46,204,113,.15);color:var(--green)}
.stat-icon.blue{background:rgba(52,152,219,.15);color:var(--blue)}
.stat-icon.purple{background:rgba(155,89,182,.15);color:var(--purple)}
.stat-icon.teal{background:rgba(26,188,156,.15);color:var(--teal)}
.stat-icon.amber{background:rgba(240,165,0,.15);color:var(--amber)}
.stat-value{font-size:1.8rem;font-weight:800;line-height:1.1}
.stat-label{font-size:.8rem;color:var(--muted);margin-top:4px}
.stat-glow{
  position:absolute;top:-20px;right:-20px;width:80px;height:80px;
  border-radius:50%;opacity:.15;filter:blur(25px);
}

/* Feature boxes */
.feature-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:24px}
.feature-list{max-height:260px;overflow-y:auto}
.feature-item{
  display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--border);
}
.feature-item:last-child{border-bottom:none}
.feature-avatar{
  width:36px;height:36px;border-radius:50%;background:var(--card2);
  display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;
  flex-shrink:0;
}
.feature-info{flex:1;min-width:0}
.feature-name{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feature-detail{font-size:.78rem;color:var(--muted)}
.badge{
  padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600;
  white-space:nowrap;display:inline-flex;align-items:center;gap:4px;
}
.badge-green{background:rgba(46,204,113,.15);color:var(--green)}
.badge-red{background:rgba(231,76,60,.15);color:var(--red)}
.badge-blue{background:rgba(52,152,219,.15);color:var(--blue)}
.badge-purple{background:rgba(155,89,182,.15);color:var(--purple)}
.badge-amber{background:rgba(240,165,0,.15);color:var(--amber)}
.badge-teal{background:rgba(26,188,156,.15);color:var(--teal)}
.badge-gray{background:rgba(136,136,170,.15);color:var(--muted)}
.vehicle-badge{font-size:.7rem;background:var(--bg2);padding:2px 8px;border-radius:4px;color:var(--muted)}

/* ============ TABLE ============ */
.table-wrap{overflow-x:auto;margin-bottom:24px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{
  text-align:left;padding:12px 14px;color:var(--muted);font-weight:600;
  border-bottom:2px solid var(--border);white-space:nowrap;font-size:.78rem;
  text-transform:uppercase;letter-spacing:.04em;
}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(255,107,0,.03)}
.table-avatar{
  width:32px;height:32px;border-radius:50%;background:var(--pri);
  display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-size:.75rem;font-weight:700;vertical-align:middle;margin-right:8px;
}
.action-btns{display:flex;gap:4px;flex-wrap:wrap}

/* ============ FILTER BAR ============ */
.filter-bar{
  display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;
}
.filter-bar select,.filter-bar input{
  padding:10px 14px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:.85rem;outline:none;
  transition:border-color .2s;
}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--pri)}
.filter-bar input{min-width:200px}
.filter-bar select{min-width:140px}

/* ============ MODALS ============ */
.modal-overlay{
  position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(4px);
}
.modal-overlay.active{display:flex}
.modal{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  width:100%;max-width:500px;max-height:85vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.4);animation:modalIn .25s;
}
.modal.glass{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;border-bottom:1px solid var(--border);
}
.modal-header h3{font-size:1.1rem;font-weight:700}
.modal-close{
  background:none;border:none;color:var(--muted);font-size:1.3rem;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;transition:all .2s;
}
.modal-close:hover{background:var(--card2);color:var(--text)}
.modal-body{padding:24px}
.modal-footer{
  padding:16px 24px;border-top:1px solid var(--border);
  display:flex;gap:10px;justify-content:flex-end;
}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-check{
  display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer;
}
.form-check input[type="checkbox"]{
  width:18px;height:18px;accent-color:var(--pri);cursor:pointer;
}

/* ============ TOAST ============ */
.toast-container{
  position:fixed;top:20px;right:20px;z-index:2000;
  display:flex;flex-direction:column;gap:10px;
}
.toast{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px 20px;min-width:280px;max-width:400px;
  box-shadow:0 10px 40px rgba(0,0,0,.3);animation:toastIn .3s;
  display:flex;align-items:center;gap:10px;
}
.toast.success{border-left:4px solid var(--green)}
.toast.error{border-left:4px solid var(--red)}
.toast.info{border-left:4px solid var(--blue)}
.toast-icon{font-size:1.2rem;flex-shrink:0}
.toast-msg{font-size:.88rem;flex:1}
.toast-close{
  background:none;border:none;color:var(--muted);font-size:1rem;
  cursor:pointer;padding:4px;
}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}

/* ============ BAR CHART (CSS) ============ */
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding:0 4px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{
  width:100%;border-radius:6px 6px 0 0;background:linear-gradient(to top,var(--pri),var(--pri2));
  transition:height .6s ease;min-height:4px;position:relative;
}
.bar:hover{filter:brightness(1.15)}
.bar-val{
  position:absolute;top:-22px;left:50%;transform:translateX(-50%);
  font-size:.72rem;font-weight:700;color:var(--text);white-space:nowrap;
}
.bar-label{font-size:.7rem;color:var(--muted);white-space:nowrap}

/* Horizontal bar chart */
.h-bar-chart{display:flex;flex-direction:column;gap:8px}
.h-bar-row{display:flex;align-items:center;gap:10px}
.h-bar-label{width:100px;font-size:.82rem;color:var(--muted);text-align:right;flex-shrink:0}
.h-bar-track{flex:1;height:24px;background:var(--bg2);border-radius:6px;overflow:hidden;position:relative}
.h-bar-fill{height:100%;border-radius:6px;transition:width .6s ease;display:flex;align-items:center;padding-left:8px;font-size:.72rem;font-weight:600;color:#fff;min-width:0}
.h-bar-val{font-size:.82rem;font-weight:600;width:60px;flex-shrink:0}

/* ============ ZONES ============ */
.zones-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.zone-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);transition:transform .2s;
}
.zone-card:hover{transform:translateY(-2px)}
.zone-map{width:100%;height:160px;border:none;filter:var(--glass)?none:brightness(.9) contrast(1.1)}
.zone-body{padding:16px}
.zone-name{font-weight:700;font-size:1rem;margin-bottom:6px}
.zone-coords{font-size:.8rem;color:var(--muted);margin-bottom:10px}
.zone-actions{display:flex;gap:6px;flex-wrap:wrap}

/* ============ BROADCASTS ============ */
.broadcast-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow);
}
.broadcast-title{font-weight:700;margin-bottom:4px}
.broadcast-msg{color:var(--muted);font-size:.88rem;margin-bottom:8px}
.broadcast-meta{font-size:.78rem;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ============ SETTINGS ============ */
.settings-section{margin-bottom:32px}
.settings-section h3{font-size:1.1rem;font-weight:700;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.theme-grid{display:flex;flex-wrap:wrap;gap:10px}
.theme-swatch{
  width:48px;height:48px;border-radius:12px;border:3px solid transparent;
  cursor:pointer;transition:all .2s;position:relative;
}
.theme-swatch:hover{transform:scale(1.1)}
.theme-swatch.active{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.theme-swatch::after{
  content:attr(data-label);position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
  font-size:.6rem;color:var(--muted);white-space:nowrap;
}
.lang-grid{display:flex;gap:10px}
.lang-btn{
  padding:10px 20px;border-radius:10px;border:2px solid var(--border);
  background:var(--card);color:var(--text);font-weight:600;transition:all .2s;
}
.lang-btn:hover{border-color:var(--pri)}
.lang-btn.active{border-color:var(--pri);background:rgba(255,107,0,.1);color:var(--pri)}

/* ============ TAB CONTENT ============ */
.tab-content{display:none;animation:fadeIn .3s}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ============ SECTION HEADERS ============ */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;flex-wrap:wrap;gap:10px;
}
.section-title{font-size:1.3rem;font-weight:800}

/* ============ RESPONSIVE ============ */
@media(max-width:768px){
  .sidebar{
    position:fixed;left:0;top:60px;bottom:0;z-index:90;
    transform:translateX(-100%);visibility:hidden;
  }
  .sidebar.open{transform:translateX(0);visibility:visible}
  .main-content{padding:16px}
  .stats-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .feature-grid{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .filter-bar{flex-direction:column;align-items:stretch}
  .filter-bar input,.filter-bar select{min-width:0;width:100%}
  .zones-grid{grid-template-columns:1fr}
  .bar-chart{height:130px}
  .h-bar-label{width:70px;font-size:.72rem}
  .table-wrap table{font-size:.8rem}
  th,td{padding:8px 10px}
  .action-btns{flex-direction:column}
}
.mobile-menu-btn{
  display:none;background:none;border:none;color:var(--text);font-size:1.4rem;
  padding:4px;
}
@media(max-width:768px){.mobile-menu-btn{display:block}}
.sidebar-overlay{
  display:none;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.4);
}
.sidebar-overlay.active{display:block}

/* ============ MISC ============ */
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:.4}
.loading-skeleton{
  background:linear-gradient(90deg,var(--card2) 25%,var(--border) 50%,var(--card2) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.flex-center{display:flex;align-items:center;justify-content:center}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mt-2{margin-top:8px}.mt-4{margin-top:16px}.mb-4{margin-bottom:16px}
.text-sm{font-size:.85rem}.text-xs{font-size:.75rem}
.text-muted{color:var(--muted)}.font-bold{font-weight:700}
.w-full{width:100%}
.checkbox-group{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
</style>
</head>

// ============ HELPERS ============
function t(key){ return (I18N[App.lang] && I18N[App.lang][key]) || (I18N.en[key]) || key; }
function $(sel){ return document.querySelector(sel); }
function $$(sel){ return document.querySelectorAll(sel); }

function api(method, path, body){
  const opts = { method, headers:{'Content-Type':'application/json'} };
  if(App.token) opts.headers['Authorization'] = 'Bearer '+App.token;
  if(body) opts.body = JSON.stringify(body);
  return fetch(path, opts).then(r=>r.json()).catch(()=>null);
}

async function apiOrMock(method, path, body, mockKey){
  const res = await api(method, path, body);
  if(res && res.success !== false) return res;
  if(mockKey && MOCK[mockKey]) return {success:true, data:MOCK[mockKey]};
  return null;
}

function toast(msg, type='info'){
  const c = $('#toastContainer');
  const icons = {success:'✓',error:'✕',info:'ℹ'};
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.innerHTML = `<span class="toast-icon">${icons[type]||'ℹ'}</span><span class="toast-msg">${msg}</span><button class="toast-close">&times;</button>`;
  el.querySelector('.toast-close').onclick = ()=>{el.style.animation='toastOut .3s forwards';setTimeout(()=>el.remove(),300)};
  c.appendChild(el);
  setTimeout(()=>{if(el.parentNode){el.style.animation='toastOut .3s forwards';setTimeout(()=>el.remove(),300)}},4000);
}

function showModal(title, bodyHtml, footerHtml){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHtml;
  $('#modalFooter').innerHTML = footerHtml;
  $('#modalOverlay').classList.add('active');
}
function hideModal(){ $('#modalOverlay').classList.remove('active'); }

function formatCurrency(v){ return '€'+Number(v).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function formatDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString(App.lang==='ru'?'ru-RU':App.lang==='ro'?'ro-RO':'en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }

function statusBadge(s){
  const map = {
    delivered:{cls:'badge-green',icon:'✓'},preparing:{cls:'badge-amber',icon:'⏳'},
    on_the_way:{cls:'badge-blue',icon:'🚴'},pending_status:{cls:'badge-gray',icon:'⏱'},
    cancelled:{cls:'badge-red',icon:'✕'},processing:{cls:'badge-purple',icon:'⚙'},
    open:{cls:'badge-green',icon:'●'},in_progress:{cls:'badge-amber',icon:'⏳'},
    resolved:{cls:'badge-blue',icon:'✓'},approved:{cls:'badge-green',icon:'✓'},
    pending:{cls:'badge-amber',icon:'⏳'},suspended:{cls:'badge-purple',icon:'⏸'},
    blocked:{cls:'badge-red',icon:'✕'},active:{cls:'badge-green',icon:'●'},
    inactive:{cls:'badge-gray',icon:'○'},
  };
  const m = map[s]||{cls:'badge-gray',icon:'●'};
  return `<span class="badge ${m.cls}">${m.icon} ${t(s)}</span>`;
}

function roleBadge(r){
  const map = {admin:'badge-red',support:'badge-teal',customer:'badge-blue',courier:'badge-amber',partner:'badge-purple'};
  return `<span class="badge ${map[r]||'badge-gray'}">${t(r+'_role')||r}</span>`;
}

function applyTheme(theme){
  App.theme = theme;
  localStorage.setItem('ely_theme', theme);
  if(theme==='default') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  // glassmorphism
  const glass = theme==='glassmorphism';
  document.querySelectorAll('.login-card,.card,.stat-card,.modal,.zone-card,.broadcast-card').forEach(el=>{
    el.classList.toggle('glass', glass);
  });
}

function applyLang(lang){
  App.lang = lang;
  localStorage.setItem('ely_lang', lang);
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') el.placeholder = t(key);
    else el.textContent = t(key);
  });
  $('#langLabel').textContent = lang.toUpperCase();
  renderSidebar();
  renderTab(App.currentTab);
}

// ============ DATA FETCHING ============
async function fetchAllData(){
  const [stats, detailed, users, couriers, restaurants, orders, zones, broadcasts] = await Promise.all([
    apiOrMock('GET','/api/admin/stats',null,'stats'),
    apiOrMock('GET','/api/admin/detailed-stats',null,'stats'),
    apiOrMock('GET','/api/admin/users',null,'users'),
    apiOrMock('GET','/api/admin/couriers',null,'couriers'),
    apiOrMock('GET','/api/restaurants',null,'restaurants'),
    apiOrMock('GET','/api/admin/orders',null,'orders'),
    apiOrMock('GET','/api/admin/zones',null,'zones'),
    apiOrMock('GET','/api/admin/broadcasts',null,'broadcasts'),
  ]);
  if(stats) App.data.stats = stats.data || stats;
  if(detailed) App.data.detailedStats = detailed.data || detailed;
  if(users) App.data.users = users.data || users;
  if(couriers) App.data.couriers = couriers.data || couriers;
  if(restaurants) App.data.restaurants = restaurants.data || restaurants;
  if(orders) App.data.orders = orders.data || orders;
  if(zones) App.data.zones = zones.data || zones;
  if(broadcasts) App.data.broadcasts = broadcasts.data || broadcasts;
  // Also try to fetch full-stats for comprehensive data
  try{const fs=await api('GET','/api/admin/full-stats');if(fs&&fs.data)App.data.fullStats=fs.data;}catch(e){}
  // Merge mock tickets
  App.data.tickets = MOCK.tickets;
  // Use detailedStats for chart data if available
  if(!App.data.detailedStats) App.data.detailedStats = MOCK.stats;
}

// ============ TAB RENDERERS ============
function renderTab(tab){
  const main = $('#mainContent');
  switch(tab){
    case 'dashboard': main.innerHTML = renderDashboard(); break;
    case 'users': main.innerHTML = renderUsers(); break;
    case 'partners': main.innerHTML = renderPartners(); break;
    case 'orders': main.innerHTML = renderOrders(); break;
    case 'zones': main.innerHTML = renderZones(); break;
    case 'stats': main.innerHTML = renderStats(); break;
    case 'broadcasts': main.innerHTML = renderBroadcasts(); break;
    case 'activity': main.innerHTML = renderActivity(); break;
    case 'courier_map': main.innerHTML = renderCourierMap(); break;
    case 'promos': main.innerHTML = renderPromos(); break;
    case 'items': main.innerHTML = renderItems(); break;
    case 'vehicle_requests': main.innerHTML = renderVehicleRequests(); break;
    case 'fees': main.innerHTML = renderFees(); break;
    case 'settings': main.innerHTML = renderSettings(); break;
  }
  bindTabEvents(tab);
}

function renderHBarChart(data){

      <div class="h-bar-label">${t(e[0])}</div>
      <div class="h-bar-track">
        <div class="h-bar-fill" style="width:${(e[1]/max*100).toFixed(1)}%;background:${colors[i%colors.length]}">${e[1]}</div>
      </div>
      <div class="h-bar-val">${e[1]}</div>

function filterUsers(){
  const role = $('#userRoleFilter')?.value||'';
  const approval = $('#userApprovalFilter')?.value||'';
  const search = ($('#userSearch')?.value||'').toLowerCase();
  let users = App.data.users.length ? App.data.users : MOCK.users;
  if(role) users = users.filter(u=>u.role===role);
  if(approval) users = users.filter(u=>u.approval_status===approval);
  if(search) users = users.filter(u=>(u.username+u.display_name+u.phone).toLowerCase().includes(search));
  const tbody = $('#usersTableBody');
  if(tbody) tbody.innerHTML = renderUserRows(users);
}

// ============ BIND TAB EVENTS ============
function bindTabEvents(tab){
  if(tab==='settings'){
    const form = $('#changePasswordForm');
    if(form) form.onsubmit = async(e)=>{
      e.preventDefault();
      const oldPw = $('#oldPw')?.value;
      const newPw = $('#newPw')?.value;
      const confirmPw = $('#confirmPw')?.value;
      if(newPw!==confirmPw){toast(t('error_occurred'),'error');return;}
      const res = await api('POST','/api/admin/change-password',{old_password:oldPw,new_password:newPw});
      if(res&&res.success!==false) toast(t('password_changed'),'success');
      else toast(t('error_occurred'),'error');
      form.reset();
    };
  }
  if(tab==='users'){
    const rf = $('#userRoleFilter');
    const af = $('#userApprovalFilter');
    if(rf) rf.onchange = filterUsers;
    if(af) af.onchange = filterUsers;
  }
}

    const span = document.createElement('span');
    span.textContent = ch;
    span.style.animationDelay = (i*0.08)+'s';
    logo.appendChild(span);
  });
  // Progress bar
  const prog = $('#splashProgress');
  const pct = $('#splashPct');
  let p = 0;
  const iv = setInterval(()=>{
    p += 4;
    if(p>100) p=100;
    pct.textContent = p+'%';
    if(p>=100){ prog.classList.add('pct-100'); clearInterval(iv); }
  }, 80);
  // Dismiss splash after 2.5s
  setTimeout(()=>{
    const splash = $('#splash');
    splash.classList.add('hidden');
    setTimeout(()=>{
      splash.style.display = 'none';
      if(App.token){ showApp(); }
      else{ showLogin(); }
    },600);
  },2500);
}

function showApp(){
  $('#splash').style.display='none';

$('#loginForm').onsubmit = async(e)=>{
  e.preventDefault();
  const username = $('#loginUser').value;
  const password = $('#loginPass').value;
  const errEl = $('#loginError');
  errEl.classList.remove('show');
  const res = await api('POST','/api/auth/login',{username,password});
  if(res && res.success && (res.token || (res.data && res.data.token))){
    App.token = res.token || res.data.token;
    localStorage.setItem('ely_token', App.token);
    showApp();
  } else {
    // Try with mock
    if(username==='admin' && (password==='123456789' || password==='admin')){
      App.token = 'mock_token';
      localStorage.setItem('ely_token', App.token);
      showApp();
    } else {
      errEl.textContent = t('login_error_invalid') || 'Invalid username or password';
      errEl.classList.add('show');
    }
  }
};

  if(!el) return;
  const reqs = (res&&res.data)?res.data:(res&&Array.isArray(res)?res:[]);
  if(!reqs.length){el.innerHTML=`<tr><td colspan="5" class="empty-state">${t('no_data')}</td></tr>`;return;}
  el.innerHTML = reqs.map(r=>`<tr>
    <td>${r.courier_name||r.username||'Courier #'+(r.courier_id||r.id)}</td>
    <td><span class="vehicle-badge">${r.current_vehicle||'-'}</span></td>
    <td><span class="badge badge-blue">${r.requested_vehicle||'-'}</span></td>
    <td>${r.created_at||r.request_date||'-'}</td>
    <td class="action-btns">
      <button class="btn btn-sm" style="background:var(--green);color:#fff" onclick="approveVehicleRequest(${r.id})">${t('approve')}</button>
      <button class="btn btn-danger btn-sm" onclick="rejectVehicleRequest(${r.id})">${t('cancel')}</button>
    </td></tr>`).join('');
}
async function approveVehicleRequest(requestId){
  const res=await api('POST','/api/admin/vehicle-approve',{request_id:requestId});
  if(res&&res.success!==false)toast('Vehicle request approved','success');else toast(t('error_occurred'),'error');
  renderTab('vehicle_requests');
}
function rejectVehicleRequest(requestId){
  showModal('Reject Vehicle Request',`
    <div class="form-group"><label>Note / Reason</label><textarea class="form-input" id="vehicleRejectNote" rows="3" placeholder="Reason for rejection..."></textarea></div>
  `,async()=>{
    const note=$('#vehicleRejectNote')?.value||'';
    const res=await api('POST','/api/admin/vehicle-reject',{request_id:requestId,note});
    if(res&&res.success!==false)toast('Vehicle request rejected','success');else toast(t('error_occurred'),'error');
    hideModal();renderTab('vehicle_requests');
  });
}

// ============ FEES TAB ============
function renderFees(){
  let html = `<div class="section-header"><h2 class="section-title">${t('tab_fees')}</h2></div>`;
  html += `<div id="feesContent" class="empty-state">${t('loading')}</div>`;
  loadFees();
  return html;
}
async function loadFees(){
  const res = await api('GET','/api/admin/settings');
  const el = $('#feesContent');
  if(!el) return;
  const s = (res&&res.data)?res.data:(res||{});
  el.innerHTML = `
  <div style="max-width:600px">
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">${t('delivery_fees')} & ${t('courier_earnings')}</div>
      <div class="form-group">
        <label>Default Delivery Fee (€)</label>
        <input class="form-input" id="feeDefaultDelivery" type="number" step="0.01" value="${s.default_delivery_fee||0}">
        <div class="text-xs text-muted mt-2">Base delivery fee charged to customers</div>
      </div>
      <div class="form-group">
        <label>Courier Earnings (%)</label>
        <input class="form-input" id="feeCourierPercent" type="number" step="0.1" value="${s.courier_earnings_percent||0}">
        <div class="text-xs text-muted mt-2">Percentage of delivery fee that goes to the courier</div>
      </div>
      <div class="form-group">
        <label>Courier Minimum Earnings (€)</label>
        <input class="form-input" id="feeCourierMin" type="number" step="0.01" value="${s.courier_min_earnings||0}">
        <div class="text-xs text-muted mt-2">Minimum amount a courier earns per delivery</div>
      </div>
      <div class="form-group">
        <label>Min Order for Free Delivery (€)</label>
        <input class="form-input" id="feeMinFreeDelivery" type="number" step="0.01" value="${s.min_order_for_free_delivery||0}">
        <div class="text-xs text-muted mt-2">Orders above this amount get free delivery</div>
      </div>
      <div class="form-group">
        <label>Platform Commission (%)</label>
        <input class="form-input" id="feeCommission" type="number" step="0.1" value="${s.platform_commission_percent||0}">
        <div class="text-xs text-muted mt-2">Commission percentage taken from restaurant revenue</div>
      </div>
      <button class="btn btn-pri w-full mt-4" onclick="saveFees()">${t('save')}</button>
    </div>
  </div>`;
}
async function saveFees(){
  const body = {
    default_delivery_fee:parseFloat($('#feeDefaultDelivery')?.value||0),
    courier_earnings_percent:parseFloat($('#feeCourierPercent')?.value||0),
    courier_min_earnings:parseFloat($('#feeCourierMin')?.value||0),
    min_order_for_free_delivery:parseFloat($('#feeMinFreeDelivery')?.value||0),
    platform_commission_percent:parseFloat($('#feeCommission')?.value||0),
  };
  const res=await api('POST','/api/admin/settings/update',body);
  if(res&&res.success!==false)toast('Settings saved','success');else toast(t('error_occurred'),'error');
}

// ============ INIT ============
applyTheme(App.theme);
applyLang(App.lang);
initSplash();
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
